services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    dns:
      - 9.9.9.9
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta npm run setup para generar .env}
      POSTGRES_DB: office
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d office"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sin "ports": PostgreSQL solo es accesible desde la red interna de Compose.

  janus:
    image: ladamalina/janus-gateway:v1.4.1
    restart: unless-stopped
    dns:
      - 9.9.9.9
    # La imagen no define entrypoint. Generamos el config de VideoRoom con el
    # admin_key del .env y arrancamos Janus exigiendo token HMAC en cada petición.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf 'general: {\n\tadmin_key = "%s"\n}\n' "$${JANUS_ADMIN_KEY}" > /var/janus/janus/etc/janus/janus.plugin.videoroom.jcfg
        exec /var/janus/janus/bin/janus --nat-1-1=${LAN_IP} -r 20000-20100 -A --token-auth-secret=$${JANUS_AUTH_SECRET}
    environment:
      DOCKER_IP: ${LAN_IP:?Ejecuta npm run setup para generar .env}
      JANUS_AUTH_SECRET: ${JANUS_AUTH_SECRET:?Ejecuta npm run setup para generar .env}
      JANUS_ADMIN_KEY: ${JANUS_ADMIN_KEY:?Ejecuta npm run setup para generar .env}
    ports:
      - "20000-20100:20000-20100/udp"


  server:
    build: .
    restart: unless-stopped
    dns:
      - 9.9.9.9
    depends_on:
      postgres:
        condition: service_healthy
      janus:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - floor_images:/app/data/floor-images
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://office:${POSTGRES_PASSWORD}@postgres:5432/office
      JWT_SECRET: ${JWT_SECRET:?Ejecuta npm run setup para generar .env}
      JANUS_PUBLIC_URL: wss://${LAN_IP}/janus
      JANUS_ROOM_SECRET: ${JANUS_ROOM_SECRET}
      JANUS_API_URL: http://janus:8088/janus
      JANUS_AUTH_SECRET: ${JANUS_AUTH_SECRET:?Ejecuta npm run setup para generar .env}
      JANUS_ADMIN_KEY: ${JANUS_ADMIN_KEY:?Ejecuta npm run setup para generar .env}


  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    dns:
      - 9.9.9.9
    depends_on:
      - server
      - janus
    environment:
      LAN_IP: ${LAN_IP}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  floor_images:
  caddy_data:
  caddy_config:
